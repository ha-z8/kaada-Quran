/* Quran.com-inspired reading layout, uniquely branded */
:root{--surface:#ffffff;--border:#e4e9e7;--accent:#087e70;--soft:#edf7f4;--qsize:34px}
body{background:#f8faf9;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}

<body><div class="shell"><header class="head"><div class="brand"><span class="brand-symbol">۞</span> KAADA <em>Quran</em></div><input class="search" id="search" type="search" placeholder="ابحث في القرآن الكريم..." aria-label="البحث في القرآن"><button class="btn" id="theme" title="الوضع الليلي">☾ المظهر</button></header><section class="hero"><div class="hero-decoration">۞</div><div class="hero-content"><span class="eyebrow">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span><h1>القرآن الكريم</h1><p>اقرأ، وتدبّر، واجعل القرآن رفيق يومك</p><button class="btn primary" id="continue">متابعة القراءة ←</button></div></section><div class="columns"><aside class="panel"><button class="btn" id="home">☷ فهرس السور</button><button class="btn" id="saved">☆ العلامات المرجعية <span id="savedCount">0</span></button><button class="btn" id="recent">◉ آخر موضع</button><div class="muted" style="margin-top:12px">المصحف برواية حفص عن عاصم</div></aside><main class="main"><div class="settings"><span>حجم خط الآيات</span><button class="btn" id="smaller">−</button><span id="fontValue">30</span><button class="btn" id="larger">+</button><label for="readingMode">طريقة العرض</label><select class="select" id="readingMode"><option value="continuous">المصحف المتصل</option><option value="verses">آية بآية</option></select><label for="quranFont">خط المصحف</label><select class="select" id="quranFont"><option value="naskh">مجمع الملك فهد — النسخ (الأول)</option><option value="digital">مجمع الملك فهد — الرقمي (الثاني)</option><option value="hafs">مصحف حفص — الخط العثماني</option></select><span id="offline" class="muted">القرآن محفوظ على الجهاز</span></div><div id="content" aria-live="polite"><div class="empty">جارٍ تحميل المصحف...</div></div></main></div><footer class="foot">KAADA Quran • القرآن الكريم كاملًا • جميع البيانات محفوظة على جهازك</footer></div><div id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.getElementById(s),pref='kaada-quran:',read=(k,d)=>{try{return JSON.parse(localStorage.getItem(pref+k))??d}catch{return d}},save=(k,v)=>{try{localStorage.setItem(pref+k,JSON.stringify(v))}catch{}},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\x27':'&#39;'}[c])),norm=s=>String(s).normalize('NFKD').replace(/[\u064b-\u065f\u0670\u06d6-\u06ed]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ـ/g,'').toLowerCase(),arab=n=>Number(n).toLocaleString('ar-SA');
let data=[],page='home',current=1,bookmarks=read('bookmarks',[]),last=read('last',{surah:1,ayah:1}),font=read('font',30),readingMode=read('readingMode','continuous'),quranFont=read('quranFont','hafs'),dark=read('dark',false),query='';
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2300)}
function apply(){document.body.classList.toggle('dark',dark);document.body.dataset.quranFont=quranFont;$('readingMode').value=readingMode;$('quranFont').value=quranFont;document.documentElement.style.setProperty('--qsize',font+'px');$('fontValue').textContent=arab(font);$('savedCount').textContent=arab(bookmarks.length);$('theme').textContent=dark?'☀ المظهر':'☾ المظهر'}
function navigate(p,s=1,a=0){page=p;current=Math.min(114,Math.max(1,s));query=p==='search'?query:'';history.replaceState(null,'',p==='reader'?'#surah/'+current+(a?'/'+a:''):'#'+p);render();window.scrollTo(0,0);if(a)requestAnimationFrame(()=>setTimeout(()=>document.getElementById('v'+a)?.scrollIntoView({block:'center'}),60))}
function render(){apply();if(!data.length)return;let el=$('content');if(page==='home'){el.innerHTML='<h2>فهرس السور</h2><div class="grid">'+data.map(c=>'<button class="chapter" data-s="'+c.id+'"><span class="number">'+arab(c.id)+'</span><span><strong>سورة '+esc(c.name)+'</strong><div class="muted">'+arab(c.verses.length)+' آية</div></span></button>').join('')+'</div>';return}
if(page==='reader'){let c=data[current-1];el.innerHTML='<div class="row reader-toolbar"><button class="btn" data-p="home">الفهرس</button><select class="select" id="choose">'+data.map(x=>'<option value="'+x.id+'" '+(x.id===current?'selected':'')+'>سورة '+esc(x.name)+'</option>').join('')+'</select><button class="btn" data-prev '+(current===1?'disabled':'')+'>السابقة</button><button class="btn" data-next '+(current===114?'disabled':'')+'>التالية</button></div><div class="paper surah-heading"><div class="surah-ornament">۞</div><h2>سُورَةُ '+esc(c.name)+'</h2><p class="muted">'+arab(c.verses.length)+' آية • رواية حفص عن عاصم</p>'+(current!==1&&current!==9?'<div class="verse-text">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':'')+'</div>'+(readingMode==='continuous'?'<div class="mushaf-page" dir="rtl">'+c.verses.map(v=>'<span class="mushaf-ayah" id="v'+v.id+'" data-ayah="'+v.id+'">'+esc(v.text)+' <span class="mushaf-number">﴿'+arab(v.id)+'﴾</span> </span>').join('')+'</div><p class="muted" style="text-align:center">اضغط على الآية لعرض أدواتها وحفظ موضع القراءة</p>':c.verses.map(v=>'<section class="verse" id="v'+v.id+'"><div class="verse-index"><span class="ayah-badge">'+arab(v.id)+'</span><span class="verse-ref">'+arab(current)+':'+arab(v.id)+'</span></div><div class="verse-body"><div class="verse-text">'+esc(v.text)+' <span class="num">۞</span></div><div class="tools"><button class="btn" data-bookmark="'+v.id+'">'+(bookmarks.includes(current+':'+v.id)?'★ محفوظة':'☆ حفظ الآية')+'</button><button class="btn" data-last="'+v.id+'">◉ حدد موضع القراءة</button><button class="btn" data-copy="'+v.id+'">نسخ</button></div></div></section>').join('')) ;return}
if(page==='saved'){el.innerHTML='<h2>العلامات المرجعية</h2>'+(bookmarks.length?bookmarks.map(b=>{let [s,a]=b.split(':').map(Number),c=data[s-1],v=c?.verses[a-1];return v?'<div class="result" data-jump="'+b+'"><strong>سورة '+esc(c.name)+' • الآية '+arab(a)+'</strong><p>'+esc(v.text)+'</p><button class="btn" data-remove="'+b+'">إزالة العلامة</button></div>':''}).join(''):'<div class="empty">لا توجد علامات مرجعية بعد.</div>');return}
if(page==='search'){let q=norm(query.trim()),out=[];if(q)for(let c of data){if(norm(c.name).includes(q))out.push([c.id,1,'سورة '+c.name]);for(let v of c.verses)if(norm(v.text).includes(q))out.push([c.id,v.id,v.text])}el.innerHTML='<h2>البحث في القرآن</h2>'+(q?'<p class="muted">'+arab(out.length)+' نتيجة • تعرض أول 150 نتيجة</p>':'')+(out.length?out.slice(0,150).map(([s,a,t])=>'<div class="result" data-jump="'+s+':'+a+'"><strong>سورة '+esc(data[s-1].name)+' • الآية '+arab(a)+'</strong><p>'+esc(t)+'</p></div>').join(''):'<div class="empty">'+(q?'لم نجد نتائج مطابقة':'اكتب كلمة أو عبارة في حقل البحث أعلى الصفحة')+'</div>')}
}
$('content').addEventListener('click',async e=>{const ayah=e.target.closest('.mushaf-ayah');if(ayah){let a=Number(ayah.dataset.ayah);let action=window.prompt('الآية '+arab(a)+'\n1: حفظ أو إلغاء العلامة\n2: متابعة القراءة من هنا\n3: نسخ الآية','1');if(action==='1'){let key=current+':'+a;bookmarks=bookmarks.includes(key)?bookmarks.filter(x=>x!==key):[...bookmarks,key];save('bookmarks',bookmarks);toast('تم تحديث العلامة')}else if(action==='2'){last={surah:current,ayah:a};save('last',last);toast('تم حفظ الموضع')}else if(action==='3'){try{await navigator.clipboard.writeText(data[current-1].verses[a-1].text);toast('نُسخت الآية')}catch{toast('تعذر النسخ')}}return}let t=e.target.closest('[data-s],[data-p],[data-prev],[data-next],[data-jump],[data-bookmark],[data-last],[data-copy],[data-remove]');if(!t)return;if(t.dataset.s)navigate('reader',Number(t.dataset.s));else if(t.dataset.p)navigate(t.dataset.p);else if(t.hasAttribute('data-prev'))navigate('reader',current-1);else if(t.hasAttribute('data-next'))navigate('reader',current+1);else if(t.dataset.jump){let [s,a]=t.dataset.jump.split(':').map(Number);navigate('reader',s,a)}else if(t.dataset.remove){e.stopPropagation();bookmarks=bookmarks.filter(x=>x!==t.dataset.remove);save('bookmarks',bookmarks);toast('أزيلت العلامة');render()}else{let a=Number(t.dataset.bookmark||t.dataset.last||t.dataset.copy);if(t.dataset.bookmark){let key=current+':'+a;bookmarks=bookmarks.includes(key)?bookmarks.filter(x=>x!==key):[...bookmarks,key];save('bookmarks',bookmarks);toast('تم تحديث العلامة');render()}else if(t.dataset.last){last={surah:current,ayah:a};save('last',last);toast('تم حفظ موضع القراءة')}else if(t.dataset.copy){try{await navigator.clipboard.writeText(data[current-1].verses[a-1].text);toast('نُسخت الآية')}catch{toast('لم يتمكن المتصفح من النسخ')}}}});
$('content').addEventListener('change',e=>{if(e.target.id==='choose')navigate('reader',Number(e.target.value))});
$('readingMode').onchange=e=>{readingMode=e.target.value;save('readingMode',readingMode);render()};$('quranFont').onchange=e=>{quranFont=e.target.value;save('quranFont',quranFont);apply()};$('home').onclick=()=>navigate('home');$('saved').onclick=()=>navigate('saved');$('continue').onclick=$('recent').onclick=()=>navigate('reader',last.surah,last.ayah);$('search').oninput=e=>{query=e.target.value;page='search';render()};$('theme').onclick=()=>{dark=!dark;save('dark',dark);apply()};$('smaller').onclick=()=>{font=Math.max(20,font-2);save('font',font);apply()};$('larger').onclick=()=>{font=Math.min(52,font+2);save('font',font);apply()};
async function boot(){apply();try{let r=await fetch('./data/quran.json');if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();if(d.length!==114||d.reduce((n,c)=>n+c.verses.length,0)!==6236||d.some((c,i)=>c.id!==i+1||!c.verses.every((v,j)=>v.id===j+1&&v.text)))throw Error('incomplete Quran data');data=d;let m=location.hash.match(/^#surah\/(\d+)(?:\/(\d+))?/);if(m)navigate('reader',Number(m[1]),Number(m[2]||0));else navigate('home');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){$('content').innerHTML='<div class="notice"><strong>لم يكتمل تجهيز النص القرآني</strong><p>ملف القرآن غير متوفر أو ناقص. افتح تبويب Actions في GitHub وشغّل سير Prepare complete Quran data حتى يضيف ملف data/quran.json. بعدها أعد تحميل الصفحة.</p><small>'+esc(e.message)+'</small></div>';console.error(e)}}
boot();
</script></body></html>
