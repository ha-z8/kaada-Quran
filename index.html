<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174a39"><meta name="description" content="المصحف الشريف - قراءة وبحث وعلامات مرجعية دون إنترنت"><link rel="manifest" href="./manifest.webmanifest"><title>كعدة قرآن | المصحف الشريف</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#1a352c;background:#f5f6f0;--surface:#fffefa;--ink:#1a352c;--secondary:#667c72;--border:#dfe7de;--accent:#1d654c;--soft:#e9f1e8;--qsize:30px}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f5f6f0;line-height:1.8}body.dark{--surface:#1b2927;--ink:#e8eee7;--secondary:#a5b9ad;--border:#34443d;--accent:#9ed6b0;--soft:#263b33;background:#111d1b}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}.shell{max-width:1200px;margin:auto;padding:18px}.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 22px}.brand{font-weight:800;font-size:23px;margin-inline-end:auto;color:var(--accent)}.btn,.search,.select{border:1px solid var(--border);background:var(--surface);border-radius:13px;color:var(--ink);padding:9px 14px}.btn:hover,.chapter:hover{border-color:var(--accent)}.btn.primary{background:#1d654c;color:white;border:0}.search{width:min(100%,310px)}.hero{background:linear-gradient(120deg,#174a39,#287458);color:white;border-radius:24px;padding:32px;margin-bottom:24px}.hero h1{margin:0;font-size:31px}.hero p{opacity:.9}.columns{display:grid;grid-template-columns:220px 1fr;gap:22px}.panel,.paper,.chapter,.verse,.result{background:var(--surface);border:1px solid var(--border);border-radius:17px}.panel{padding:18px;align-self:start;position:sticky;top:12px}.panel button{width:100%;text-align:right;margin:4px 0}.main{min-width:0}h2{margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.chapter{padding:15px;text-align:right;color:var(--ink);display:flex;gap:12px;align-items:center}.number{display:grid;place-items:center;background:var(--soft);color:var(--accent);border-radius:12px;width:38px;height:38px;flex-shrink:0}.muted{color:var(--secondary);font-size:13px}.paper{padding:28px;text-align:center}.verse{padding:22px;margin:13px 0;text-align:right;scroll-margin-top:24px}.verse-text{font-family:"Traditional Arabic","Amiri","Scheherazade New",serif;font-size:var(--qsize);line-height:2.4}.num{color:var(--accent);white-space:nowrap}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tools .btn{font-size:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.row select{flex:1;min-width:160px}.result{padding:16px;margin-bottom:10px;cursor:pointer}.result p{font-family:"Traditional Arabic",serif;font-size:23px}.empty{background:var(--surface);border:1px dashed var(--border);border-radius:15px;padding:28px;text-align:center}.notice{background:#fff1d6;color:#503c12;padding:12px;border-radius:12px;margin:15px 0}.foot{text-align:center;padding:36px;color:var(--secondary)}.hidden{display:none!important}#toast{position:fixed;bottom:18px;left:18px;padding:10px 16px;background:#174a39;color:white;border-radius:10px;display:none}.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--border);border-radius:15px;margin-bottom:16px;background:var(--surface)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.panel{position:static;display:flex;gap:8px;flex-wrap:wrap}.panel button{width:auto}}@media(max-width:550px){.grid{grid-template-columns:1fr}.paper{padding:15px}.hero{padding:22px}.head{gap:8px}.search{width:100%}.brand{width:100%}.verse{padding:14px}.shell{padding:12px}}
</style></head>
<body><div class="shell"><header class="head"><div class="brand">۞ كعدة قرآن</div><input class="search" id="search" type="search" placeholder="ابحث في القرآن الكريم..." aria-label="البحث في القرآن"><button class="btn" id="theme" title="الوضع الليلي">☾ المظهر</button></header><section class="hero"><h1>القرآن الكريم</h1><p>اقرأ وتدبر، أينما كنت — قراءة وبحث وعلامات مرجعية محفوظة على جهازك.</p><button class="btn primary" id="continue">متابعة القراءة</button></section><div class="columns"><aside class="panel"><button class="btn" id="home">☷ فهرس السور</button><button class="btn" id="saved">☆ العلامات المرجعية <span id="savedCount">0</span></button><button class="btn" id="recent">◉ آخر موضع</button><div class="muted" style="margin-top:12px">المصحف برواية حفص عن عاصم</div></aside><main class="main"><div class="settings"><span>حجم خط الآيات</span><button class="btn" id="smaller">−</button><span id="fontValue">30</span><button class="btn" id="larger">+</button><span id="offline" class="muted">ملفات القرآن محلية</span></div><div id="content" aria-live="polite"><div class="empty">جارٍ تحميل المصحف...</div></div></main></div><footer class="foot">كعدة قرآن • القرآن الكريم كاملًا • جميع البيانات محفوظة على جهازك</footer></div><div id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.getElementById(s),pref='kaada-quran:',read=(k,d)=>{try{return JSON.parse(localStorage.getItem(pref+k))??d}catch{return d}},save=(k,v)=>{try{localStorage.setItem(pref+k,JSON.stringify(v))}catch{}},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\x27':'&#39;'}[c])),norm=s=>String(s).normalize('NFKD').replace(/[\u064b-\u065f\u0670\u06d6-\u06ed]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ـ/g,'').toLowerCase(),arab=n=>Number(n).toLocaleString('ar-SA');
let data=[],page='home',current=1,bookmarks=read('bookmarks',[]),last=read('last',{surah:1,ayah:1}),font=read('font',30),dark=read('dark',false),query='';
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2300)}
function apply(){document.body.classList.toggle('dark',dark);document.documentElement.style.setProperty('--qsize',font+'px');$('fontValue').textContent=arab(font);$('savedCount').textContent=arab(bookmarks.length);$('theme').textContent=dark?'☀ المظهر':'☾ المظهر'}
function navigate(p,s=1,a=0){page=p;current=Math.min(114,Math.max(1,s));query=p==='search'?query:'';history.replaceState(null,'',p==='reader'?'#surah/'+current+(a?'/'+a:''):'#'+p);render();window.scrollTo(0,0);if(a)requestAnimationFrame(()=>setTimeout(()=>document.getElementById('v'+a)?.scrollIntoView({block:'center'}),60))}
function render(){apply();if(!data.length)return;let el=$('content');if(page==='home'){el.innerHTML='<h2>فهرس السور</h2><div class="grid">'+data.map(c=>'<button class="chapter" data-s="'+c.id+'"><span class="number">'+arab(c.id)+'</span><span><strong>سورة '+esc(c.name)+'</strong><div class="muted">'+arab(c.verses.length)+' آية</div></span></button>').join('')+'</div>';return}
if(page==='reader'){let c=data[current-1];el.innerHTML='<div class="row"><button class="btn" data-p="home">الفهرس</button><select class="select" id="choose">'+data.map(x=>'<option value="'+x.id+'" '+(x.id===current?'selected':'')+'>سورة '+esc(x.name)+'</option>').join('')+'</select><button class="btn" data-prev '+(current===1?'disabled':'')+'>السابقة</button><button class="btn" data-next '+(current===114?'disabled':'')+'>التالية</button></div><div class="paper"><h2>۞ سورة '+esc(c.name)+' ۞</h2><p class="muted">'+arab(c.verses.length)+' آية</p>'+(current!==1&&current!==9?'<div class="verse-text">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>':'')+'</div>'+c.verses.map(v=>'<section class="verse" id="v'+v.id+'"><div class="verse-text">'+esc(v.text)+' <span class="num">﴿'+arab(v.id)+'﴾</span></div><div class="tools"><button class="btn" data-bookmark="'+v.id+'">'+(bookmarks.includes(current+':'+v.id)?'★ محفوظة':'☆ حفظ الآية')+'</button><button class="btn" data-last="'+v.id+'">◉ حدد موضع القراءة</button><button class="btn" data-copy="'+v.id+'">نسخ</button></div></section>').join('');return}
if(page==='saved'){el.innerHTML='<h2>العلامات المرجعية</h2>'+(bookmarks.length?bookmarks.map(b=>{let [s,a]=b.split(':').map(Number),c=data[s-1],v=c?.verses[a-1];return v?'<div class="result" data-jump="'+b+'"><strong>سورة '+esc(c.name)+' • الآية '+arab(a)+'</strong><p>'+esc(v.text)+'</p><button class="btn" data-remove="'+b+'">إزالة العلامة</button></div>':''}).join(''):'<div class="empty">لا توجد علامات مرجعية بعد.</div>');return}
if(page==='search'){let q=norm(query.trim()),out=[];if(q)for(let c of data){if(norm(c.name).includes(q))out.push([c.id,1,'سورة '+c.name]);for(let v of c.verses)if(norm(v.text).includes(q))out.push([c.id,v.id,v.text])}el.innerHTML='<h2>البحث في القرآن</h2>'+(q?'<p class="muted">'+arab(out.length)+' نتيجة • تعرض أول 150 نتيجة</p>':'')+(out.length?out.slice(0,150).map(([s,a,t])=>'<div class="result" data-jump="'+s+':'+a+'"><strong>سورة '+esc(data[s-1].name)+' • الآية '+arab(a)+'</strong><p>'+esc(t)+'</p></div>').join(''):'<div class="empty">'+(q?'لم نجد نتائج مطابقة':'اكتب كلمة أو عبارة في حقل البحث أعلى الصفحة')+'</div>')}
}
$('content').addEventListener('click',async e=>{let t=e.target.closest('[data-s],[data-p],[data-prev],[data-next],[data-jump],[data-bookmark],[data-last],[data-copy],[data-remove]');if(!t)return;if(t.dataset.s)navigate('reader',Number(t.dataset.s));else if(t.dataset.p)navigate(t.dataset.p);else if(t.hasAttribute('data-prev'))navigate('reader',current-1);else if(t.hasAttribute('data-next'))navigate('reader',current+1);else if(t.dataset.jump){let [s,a]=t.dataset.jump.split(':').map(Number);navigate('reader',s,a)}else if(t.dataset.remove){e.stopPropagation();bookmarks=bookmarks.filter(x=>x!==t.dataset.remove);save('bookmarks',bookmarks);toast('أزيلت العلامة');render()}else{let a=Number(t.dataset.bookmark||t.dataset.last||t.dataset.copy);if(t.dataset.bookmark){let key=current+':'+a;bookmarks=bookmarks.includes(key)?bookmarks.filter(x=>x!==key):[...bookmarks,key];save('bookmarks',bookmarks);toast('تم تحديث العلامة');render()}else if(t.dataset.last){last={surah:current,ayah:a};save('last',last);toast('تم حفظ موضع القراءة')}else if(t.dataset.copy){try{await navigator.clipboard.writeText(data[current-1].verses[a-1].text);toast('نُسخت الآية')}catch{toast('لم يتمكن المتصفح من النسخ')}}}});
$('content').addEventListener('change',e=>{if(e.target.id==='choose')navigate('reader',Number(e.target.value))});
$('home').onclick=()=>navigate('home');$('saved').onclick=()=>navigate('saved');$('continue').onclick=$('recent').onclick=()=>navigate('reader',last.surah,last.ayah);$('search').oninput=e=>{query=e.target.value;page='search';render()};$('theme').onclick=()=>{dark=!dark;save('dark',dark);apply()};$('smaller').onclick=()=>{font=Math.max(20,font-2);save('font',font);apply()};$('larger').onclick=()=>{font=Math.min(52,font+2);save('font',font);apply()};
async function boot(){apply();try{let r=await fetch('./data/quran.json');if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();if(d.length!==114||d.reduce((n,c)=>n+c.verses.length,0)!==6236||d.some((c,i)=>c.id!==i+1||!c.verses.every((v,j)=>v.id===j+1&&v.text)))throw Error('incomplete Quran data');data=d;let m=location.hash.match(/^#surah\/(\d+)(?:\/(\d+))?/);if(m)navigate('reader',Number(m[1]),Number(m[2]||0));else navigate('home');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){$('content').innerHTML='<div class="notice"><strong>لم يكتمل تجهيز النص القرآني</strong><p>ملف القرآن غير متوفر أو ناقص. افتح تبويب Actions في GitHub وشغّل سير Prepare complete Quran data حتى يضيف ملف data/quran.json. بعدها أعد تحميل الصفحة.</p><small>'+esc(e.message)+'</small></div>';console.error(e)}}
boot();
</script></body></html>
