name: WIRD reciter CDN audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/reciter-availability.mjs'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live audio files for every advertised reader
        run: node tests/reciter-availability.mjs
