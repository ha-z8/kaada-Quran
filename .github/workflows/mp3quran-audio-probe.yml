name: Verify optional full-surah recitation CDN access
on:
  push:
    paths:
      - 'tests/mp3quran-audio-probe.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/mp3quran-audio-probe.mjs
